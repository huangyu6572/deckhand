# 复制到 %LOCALAPPDATA%\LocalAIHub\connections.yaml
# 不要写入密码或私钥正文。

targets:
  dev-web:
    transport: ssh
    host: 192.168.1.20
    user: devops
    auth:
      type: ssh-agent

  test-web:
    transport: ssh
    host: 192.168.1.21
    user: deploy
    auth:
      type: private-key
      key_path: C:\Users\me\.ssh\id_ed25519

  board-01:
    transport: serial
    port: COM3
    baud_rate: 115200
    prompt_pattern: ">"
